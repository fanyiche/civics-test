<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#22325a">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>入籍公民考试题库</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Noto+Sans+SC:wght@400;500;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: phone-first single column "study app" with a fixed bottom tab bar; document/certificate feel — navy ink on cool paper, a seal-red accent for the official bits */
:root{
  --paper:#f3f5f8; --card:#ffffff; --ink:#18223a; --muted:#5d6782; --line:#dde2ec;
  --navy:#22325a; --navy-soft:#e6ebf5; --seal:#b0353a; --seal-soft:#f8e7e7;
  --good:#2f7a4f; --good-soft:#e3f2e9; --warn:#a8641a; --warn-soft:#fbefdd;
  --display:"Libre Caslon Text", Georgia, "Noto Serif SC", serif;
  --body:"Source Sans 3", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --zh:"Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1424; --card:#182036; --ink:#e8ecf6; --muted:#9aa5c2; --line:#2a3452;
  --navy:#9fb4ea; --navy-soft:#22305a; --seal:#ec7a7e; --seal-soft:#3a2026;
  --good:#6fcf97; --good-soft:#1b3428; --warn:#f0b56b; --warn-soft:#3a2c18; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1424; --card:#182036; --ink:#e8ecf6; --muted:#9aa5c2; --line:#2a3452;
  --navy:#9fb4ea; --navy-soft:#22305a; --seal:#ec7a7e; --seal-soft:#3a2026;
  --good:#6fcf97; --good-soft:#1b3428; --warn:#f0b56b; --warn-soft:#3a2c18; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{text-wrap:balance;margin:0}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.zh{font-family:var(--zh);color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--paper)}
.btn.good{background:var(--good);border-color:var(--good);color:var(--paper)}
.btn.bad{background:var(--seal);border-color:var(--seal);color:var(--paper)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 0}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--navy-soft);color:var(--navy)}
.chip.star{background:var(--seal-soft);color:var(--seal)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.icon-btn{border:1px solid var(--line);background:var(--card);border-radius:999px;width:42px;height:42px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.icon-btn svg{width:20px;height:20px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.seal{width:44px;height:44px;border-radius:50%;border:2px solid var(--seal);color:var(--seal);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:13px;flex:none;position:relative}
.seal::after{content:"";position:absolute;inset:3px;border:1px dashed var(--seal);border-radius:50%;opacity:.6}
.brand h1{font-family:var(--display);font-size:20px;line-height:1.15}
.brand p{margin:0;font-size:13px;color:var(--muted)}

/* home */
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{width:112px;height:112px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring .num b{font-family:var(--display);font-size:30px;font-variant-numeric:tabular-nums}
.ring .num span{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.stat{text-align:left}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px;min-height:118px}
.mode:hover{border-color:var(--navy)}
.mode .t{font-weight:700;font-size:17px}
.mode .d{font-size:13px;color:var(--muted)}
.mode .ic{width:34px;height:34px;border-radius:10px;background:var(--navy-soft);color:var(--navy);display:grid;place-items:center}
.mode .ic svg{width:19px;height:19px}
.mode.exam{grid-column:1/-1;background:var(--navy);border-color:var(--navy);color:var(--paper);min-height:auto}
.mode.exam .d{color:var(--paper);opacity:.8}
.mode.exam .ic{background:rgba(255,255,255,.14);color:var(--paper)}
.secbar{display:flex;flex-direction:column;gap:10px}
.secline{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14px}
.bar{grid-column:1/-1;height:6px;background:var(--navy-soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--navy);border-radius:99px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.toggle label{flex:1;min-width:0}
.toggle small{display:block;color:var(--muted);font-size:13px}
.switch{appearance:none;width:48px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch:checked{background:var(--navy)}
.switch:checked::after{transform:translateX(20px)}

/* question card */
.qhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.qnum{font-family:var(--display);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.qtext{font-family:var(--display);font-size:22px;line-height:1.35}
.qzh{font-size:15px;margin-top:8px}
.answers{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.answers li{padding:10px 12px;border-radius:10px;background:var(--navy-soft);display:flex;flex-direction:column;gap:2px}
.answers li .zh{font-size:14px}
.note{font-size:13px;color:var(--muted);background:var(--warn-soft);border-radius:10px;padding:10px 12px}
.note b{color:var(--warn)}
.flash{min-height:300px;display:flex;flex-direction:column;gap:16px;cursor:pointer}
.reveal-hint{margin-top:auto;font-size:13px;color:var(--muted);text-align:center;border-top:1px dashed var(--line);padding-top:12px}
.progress-top{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.progress-top .bar{flex:1;grid-column:auto}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.opt:hover:not(:disabled){border-color:var(--navy)}
.opt .zh{font-size:14px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--seal);background:var(--seal-soft)}
.opt:disabled{cursor:default}
.tally{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.tally div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 6px}
.tally b{display:block;font-size:24px;font-variant-numeric:tabular-nums;font-family:var(--display)}
.tally span{font-size:12px;color:var(--muted)}
.tally .ok b{color:var(--good)} .tally .no b{color:var(--seal)}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--line)}
.dots i.ok{background:var(--good)} .dots i.no{background:var(--seal)} .dots i.cur{outline:2px solid var(--navy);outline-offset:1px}
.result{text-align:center;padding:28px 18px}
.result .stamp{display:inline-block;font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:.08em;border:3px solid currentColor;border-radius:10px;padding:6px 18px;transform:rotate(-4deg);margin:10px 0 14px}
.result.pass .stamp{color:var(--good)} .result.fail .stamp{color:var(--seal)}

/* list */
.search{display:flex;gap:8px}
.search input,select,.field input{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.filters button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:14px}
.filters button.on{background:var(--navy);color:var(--paper);border-color:var(--navy)}
.qitem{border-bottom:1px solid var(--line)}
.qitem summary{list-style:none;cursor:pointer;padding:14px 2px;display:grid;grid-template-columns:38px 1fr auto;gap:8px;align-items:start}
.qitem summary::-webkit-details-marker{display:none}
.qitem .n{font-family:var(--display);color:var(--muted);font-variant-numeric:tabular-nums}
.qitem .t{min-width:0}
.qitem .t .zh{font-size:13px;display:block}
.qitem .body{padding:0 2px 16px 46px;display:flex;flex-direction:column;gap:10px}
.secttl{font-family:var(--display);font-size:15px;color:var(--seal);padding:18px 2px 4px;border-bottom:2px solid var(--line)}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px}
.field span{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:40px 10px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs nav{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.segs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--navy-soft);border-radius:12px;padding:4px}
.segs button{border:0;background:none;border-radius:9px;padding:9px 4px;font-weight:600;font-size:14px;color:var(--muted)}
.segs button.on{background:var(--card);color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sentence{font-family:var(--display);font-size:26px;line-height:1.5;display:flex;flex-wrap:wrap;gap:2px 8px}
.sentence button{border:0;background:none;padding:0 2px;border-radius:6px;font:inherit;color:var(--ink);border-bottom:2px dotted var(--line)}
.sentence button:hover{background:var(--navy-soft)}
.dict-in{width:100%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:14px;font:inherit;font-size:20px;font-family:var(--display)}
.diff{font-family:var(--display);font-size:20px;line-height:1.6;display:flex;flex-wrap:wrap;gap:2px 8px}
.diff .ok{color:var(--good)}
.diff .miss{color:var(--seal);text-decoration:underline wavy;text-underline-offset:4px}
.diff .extra{color:var(--muted);text-decoration:line-through}
.vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.vocab button{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px;font-size:15px}
.vocab button:hover{border-color:var(--navy)}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;font-size:11px;color:var(--muted);font-family:var(--zh)}
.tabs button svg{width:22px;height:22px}
.tabs button.on{color:var(--navy);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:99px;font-size:14px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (max-width:420px){.qtext{font-size:20px}.hero{grid-template-columns:1fr;justify-items:center;text-align:center}.stats{width:100%}.stat{text-align:center}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap" id="app"></div>
<div class="tabs"><nav id="tabs"></nav></div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ---------- 官方题库：USCIS M-1778 (09/25)，2025 版 128 题 ---------- */
// [编号, 65/20星号, 英文问题, 中文问题, [[英文答案, 中文],...], 需答几项]
const Q = [
[1,0,"What is the form of government of the United States?","美国的政府形式是什么？",[["Republic","共和国"],["Constitution-based federal republic","以宪法为基础的联邦共和国"],["Representative democracy","代议制民主"]]],
[2,1,"What is the supreme law of the land?","美国的最高法律是什么？",[["(U.S.) Constitution","（美国）宪法"]]],
[3,0,"Name one thing the U.S. Constitution does.","说出美国宪法的一项作用。",[["Forms the government","组建政府"],["Defines powers of government","规定政府的权力"],["Defines the parts of government","规定政府的组成部分"],["Protects the rights of the people","保护人民的权利"]]],
[4,0,"The U.S. Constitution starts with the words “We the People.” What does “We the People” mean?","美国宪法以 “We the People（我们人民）” 开头，它是什么意思？",[["Self-government","自治"],["Popular sovereignty","人民主权"],["Consent of the governed","被统治者的同意"],["People should govern themselves","人民应该自己治理自己"],["(Example of) social contract","社会契约（的例子）"]]],
[5,0,"How are changes made to the U.S. Constitution?","如何修改美国宪法？",[["Amendments","修正案"],["The amendment process","修宪程序"]]],
[6,0,"What does the Bill of Rights protect?","《权利法案》保护什么？",[["(The basic) rights of Americans","美国人的（基本）权利"],["(The basic) rights of people living in the United States","住在美国的人的（基本）权利"]]],
[7,1,"How many amendments does the U.S. Constitution have?","美国宪法有多少条修正案？",[["Twenty-seven (27)","二十七条（27）"]]],
[8,0,"Why is the Declaration of Independence important?","《独立宣言》为什么重要？",[["It says America is free from British control.","它宣布美国脱离英国控制。"],["It says all people are created equal.","它说人人生而平等。"],["It identifies inherent rights.","它确认了天赋（固有）权利。"],["It identifies individual freedoms.","它确认了个人自由。"]]],
[9,0,"What founding document said the American colonies were free from Britain?","哪一份建国文件宣布美洲殖民地脱离英国？",[["Declaration of Independence","《独立宣言》"]]],
[10,0,"Name two important ideas from the Declaration of Independence and the U.S. Constitution.","说出《独立宣言》和美国宪法中的两个重要理念。",[["Equality","平等"],["Liberty","自由"],["Social contract","社会契约"],["Natural rights","自然权利"],["Limited government","有限政府"],["Self-government","自治"]],2],
[11,0,"The words “Life, Liberty, and the pursuit of Happiness” are in what founding document?","“生命、自由和追求幸福”出自哪一份建国文件？",[["Declaration of Independence","《独立宣言》"]]],
[12,1,"What is the economic system of the United States?","美国的经济制度是什么？",[["Capitalism","资本主义"],["Free market economy","自由市场经济"]]],
[13,0,"What is the rule of law?","什么是法治？",[["Everyone must follow the law.","人人都必须守法。"],["Leaders must obey the law.","领导人必须守法。"],["Government must obey the law.","政府必须守法。"],["No one is above the law.","任何人都不能凌驾于法律之上。"]]],
[14,0,"Many documents influenced the U.S. Constitution. Name one.","许多文件影响了美国宪法，说出其中一份。",[["Declaration of Independence","《独立宣言》"],["Articles of Confederation","《邦联条例》"],["Federalist Papers","《联邦党人文集》"],["Anti-Federalist Papers","《反联邦党人文集》"],["Virginia Declaration of Rights","《弗吉尼亚权利宣言》"],["Fundamental Orders of Connecticut","《康涅狄格基本法》"],["Mayflower Compact","《五月花号公约》"],["Iroquois Great Law of Peace","易洛魁《和平大法》"]]],
[15,0,"There are three branches of government. Why?","政府为什么有三个分支？",[["So one part does not become too powerful","防止某一部分权力过大"],["Checks and balances","制衡"],["Separation of powers","三权分立"]]],
[16,0,"Name the three branches of government.","说出政府的三个分支。",[["Legislative, executive, and judicial","立法、行政和司法"],["Congress, president, and the courts","国会、总统和法院"]]],
[17,0,"The President of the United States is in charge of which branch of government?","美国总统负责政府的哪个分支？",[["Executive branch","行政分支"]]],
[18,0,"What part of the federal government writes laws?","联邦政府的哪个部分制定法律？",[["(U.S.) Congress","（美国）国会"],["(U.S. or national) legislature","（美国或国家）立法机构"],["Legislative branch","立法分支"]]],
[19,0,"What are the two parts of the U.S. Congress?","美国国会由哪两部分组成？",[["Senate and House (of Representatives)","参议院和众议院"]]],
[20,1,"Name one power of the U.S. Congress.","说出美国国会的一项权力。",[["Writes laws","制定法律"],["Declares war","宣战"],["Makes the federal budget","制定联邦预算"]]],
[21,0,"How many U.S. senators are there?","美国有多少位联邦参议员？",[["One hundred (100)","一百位（100）"]]],
[22,0,"How long is a term for a U.S. senator?","美国联邦参议员一届任期多长？",[["Six (6) years","六年（6）"]]],
[23,0,"Who is one of your state's U.S. senators now?","你所在州现任的一位联邦参议员是谁？",[["Answers will vary.","答案因人而异。"]],1,"senator"],
[24,0,"How many voting members are in the House of Representatives?","众议院有多少位有投票权的议员？",[["Four hundred thirty-five (435)","四百三十五位（435）"]]],
[25,0,"How long is a term for a member of the House of Representatives?","众议员一届任期多长？",[["Two (2) years","两年（2）"]]],
[26,0,"Why do U.S. representatives serve shorter terms than U.S. senators?","为什么众议员的任期比参议员短？",[["To more closely follow public opinion","为了更紧密地反映民意"]]],
[27,0,"How many senators does each state have?","每个州有几位参议员？",[["Two (2)","两位（2）"]]],
[28,0,"Why does each state have two senators?","为什么每个州有两位参议员？",[["Equal representation (for small states)","（让小州也有）平等代表权"],["The Great Compromise (Connecticut Compromise)","大妥协（康涅狄格妥协）"]]],
[29,0,"Name your U.S. representative.","说出你的联邦众议员的名字。",[["Answers will vary.","答案因人而异。"]],1,"rep"],

  const p=prog(id);p.seen++;

  else{p.streak=0;if(!S.wrong.includes(id))S.wrong.push(id);}
  save();
}

}

function localAnswer(q){
  const st=S.settings;
  if(q.kind==="capital")return st.state?CAPITALS[st.state]:"";
  if(q.kind==="senator")return st.senator;if(q.kind==="rep")return st.rep;if(q.kind==="governor")return st.governor;

}
function answersHTML(q){
  const zh=S.settings.zh;
  if(q.kind&&q.kind!=="official"){
    const mine=localAnswer(q);
    const where={senator:"可在 senate.gov 查询",rep:"可在 house.gov 输入邮编查询",governor:"可在州政府官网查询",capital:"在“设置”里选择你的州即可自动填写"}[q.kind];

    <div class="note"><b>答案因人而异。</b> ${mine?"以上是你在设置里填写的答案。":"请在首页“设置”里填写你所在州的信息。"}${where}。住在华盛顿特区或美属领地的人有特别答法，详见 USCIS 官方题库。</div>`;
  }
  let h=`<ul class="answers">${q.a.map(([e,c])=>`<li><span>${esc(e)}</span>${zh?`<span class="zh">${esc(c)}</span>`:""}</li>`).join("")}</ul>`;
  if(q.n>1)h+=`<div class="note"><b>需要说出 ${q.n} 个。</b> 从上面任选 ${q.n} 个回答即可。</div>`;
  if(q.kind==="official")h+=`<div class="note"><b>答案会随选举或任命变化。</b> 面试时要回答当时在任者的名字。以上答案依据 USCIS 2025-09-18 更新，考前请到 uscis.gov/citizenship/testupdates 核对。</div>`;

  return h;
}

/* ---------- 记忆卡片 ---------- */
function learnDeck(ids){
  const P=ids?Q.filter(q=>ids.includes(q.id)):pool();
  const score=q=>{const p=S.p[q.id];return p?(p.streak*10+p.seen):-1;};
  return shuffle(P).sort((a,b)=>score(a)-score(b)).map(q=>q.id);
}
function Learn(){
  if(!state.deck){state.deck=learnDeck(state.ids);state.i=0;state.flip=false;state.done=0;}
  const {deck}=state;
  if(state.i>=deck.length){
    $("#app").innerHTML=`<div class="card result pass"><div class="stamp">DONE</div><h2>这一组学完了</h2><p class="zh">共 ${deck.length} 张卡片。</p><div class="row" style="margin-top:16px"><button class="btn primary" id="again">再来一轮</button><button class="btn" data-go="home">回首页</button></div></div>`;
    $("#again").onclick=()=>go("learn",{ids:state.ids});return;}
  const q=Q.find(x=>x.id===deck[state.i]);
  $("#app").innerHTML=`
  <div class="stack">
   <div class="progress-top"><span>${state.ids?"错题卡片":"记忆卡片"}</span><div class="bar"><i style="width:${state.i/deck.length*100}%"></i></div><span>${state.i+1}/${deck.length}</span></div>
   <div class="card flash" id="flash" tabindex="0" role="button" aria-label="${state.flip?"答案":"点击查看答案"}">
    ${qBlock(q,{answers:state.flip})}
    ${state.flip?(q.kind?"":`<div class="row"><button class="btn ghost" data-speak-a="${q.id}" style="flex:none">${I.speak} 朗读答案</button><button class="btn ghost" data-speak-a="${q.id}" data-slow="1" style="flex:none">${I.slow} 慢速</button></div>`):`<div class="reveal-hint">先在心里用英文回答，再点卡片看答案</div>`}
   </div>
   ${state.flip?`<div class="row"><button class="btn bad" id="no">还不会</button><button class="btn good" id="yes">记住了</button></div>`:`<button class="btn primary" id="show">显示答案</button>`}
  </div>`;
  const flip=()=>{if(!state.flip){state.flip=true;Learn();}};
  $("#flash").onclick=flip;$("#flash").onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();flip();}};
  if($("#show"))$("#show").onclick=flip;
  const next=g=>{mark(q.id,g);state.i++;state.flip=false;Learn();};
  if($("#yes")){$("#yes").onclick=()=>next(true);$("#no").onclick=()=>next(false);}
}

/* ---------- 选择题 ---------- */
function correctLabel(q){const picks=shuffle(q.a).slice(0,q.n);return{e:picks.map(a=>a[0]).join(" · "),z:picks.map(a=>a[1]).join(" · ")};}
function buildOptions(q){
  const valid=new Set(q.a.map(a=>a[0]));
  const right=correctLabel(q);
  const sameSec=Q.filter(x=>x.id!==q.id&&!x.kind&&secOf(x.id)===secOf(q.id));
  // 先用同一大类的题做干扰项，不够再从其他类补
  const others=[...shuffle(sameSec),...shuffle(Q.filter(x=>x.id!==q.id&&!x.kind&&secOf(x.id)!==secOf(q.id)))];
  const opts=[],seen=new Set([right.e]);
  for(const o of others){
    if(opts.length>=3)break;
    const cand=shuffle(o.a.filter(a=>!valid.has(a[0]))).slice(0,q.n);
    if(cand.length<q.n)continue;
    const e=cand.map(a=>a[0]).join(" · ");if(seen.has(e))continue;
    seen.add(e);opts.push({e,z:cand.map(a=>a[1]).join(" · "),ok:false});
  }
  opts.push({...right,ok:true});return shuffle(opts);
}
function Quiz(){
  if(!state.list){
    const src=state.ids?Q.filter(q=>state.ids.includes(q.id)):pool();
    const P=src.filter(q=>!q.kind||q.kind==="official");
    const w=q=>{const p=S.p[q.id];return p?p.streak:-1;};
    state.list=shuffle(P).sort((a,b)=>w(a)-w(b)).slice(0,Math.min(10,P.length)).map(q=>q.id);
    state.i=0;state.ok=0;state.ans=null;state.opts=null;
  }
  if(state.i>=state.list.length){
    const pass=state.ok/state.list.length>=0.6;
    $("#app").innerHTML=`<div class="card result ${pass?"pass":"fail"}"><div class="stamp">${state.ok}/${state.list.length}</div><h2>${pass?"做得不错":"再练练"}</h2><p class="zh">答错的题已经加入错题本。</p><div class="row" style="margin-top:16px"><button class="btn primary" id="again">再来 10 题</button><button class="btn" data-go="wrong">看错题</button></div></div>`;
    $("#again").onclick=()=>go("quiz",{ids:state.ids});return;}
  const q=Q.find(x=>x.id===state.list[state.i]);
  if(!state.opts)state.opts=buildOptions(q);
  const zh=S.settings.zh,a=state.ans;
  $("#app").innerHTML=`<div class="stack">
   <div class="progress-top"><span>选择题</span><div class="bar"><i style="width:${state.i/state.list.length*100}%"></i></div><span>${state.i+1}/${state.list.length} · 对 ${state.ok}</span></div>
   <div class="card">${qBlock(q)}${q.n>1?`<div class="note" style="margin-top:12px"><b>需要说出 ${q.n} 个。</b> 选出全部正确的那一组。</div>`:""}</div>
   <div class="opts">${state.opts.map((o,i)=>{let c="";if(a!==null){if(o.ok)c="right";else if(i===a)c="wrong";}
     return `<button class="opt ${c}" data-i="${i}" ${a!==null?"disabled":""}><span>${esc(o.e)}</span>${zh?`<span class="zh">${esc(o.z)}</span>`:""}</button>`;}).join("")}</div>
   ${a!==null?`<details class="card"><summary style="cursor:pointer;font-weight:600">查看全部可接受答案</summary><div style="margin-top:12px">${answersHTML(q)}</div></details><button class="btn primary" id="next">${state.i+1<state.list.length?"下一题":"看结果"}</button>`:""}
  </div>`;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;state.ans=i;const ok=state.opts[i].ok;if(ok)state.ok++;mark(q.id,ok);Quiz();});
  if($("#next"))$("#next").onclick=()=>{state.i++;state.ans=null;state.opts=null;Quiz();};
}

    if(!state.saved){state.saved=true;const d=new Date();S.exams.push({date:`${d.getMonth()+1}月${d.getDate()}日 ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`,ok,total:state.res.length,pass});S.exams=S.exams.slice(-30);save();}

    $("#again").onclick=()=>go("exam");return;
  }
  const q=Q.find(x=>x.id===state.list[state.i]);
  $("#app").innerHTML=`<div class="stack">
   <div class="tally"><div><b>${state.i+1}</b><span>第几题</span></div><div class="ok"><b>${ok}</b><span>答对 / 需 ${need}</span></div><div class="no"><b>${no}</b><span>答错 / 上限 ${maxWrong}</span></div></div>

  </div>`;
  if($("#show"))$("#show").onclick=()=>{state.flip=true;Exam();};

}

const VOCAB={
 "阅读词汇":{"人物":["Abraham Lincoln","George Washington"],"公民":["American flag","Bill of Rights","capital","citizen","city","Congress","country","Father of Our Country","government","President","right","Senators","state/states","White House"],"地点":["America","United States","U.S."],"节日":["Presidents' Day","Memorial Day","Flag Day","Independence Day","Labor Day","Columbus Day","Thanksgiving"],"疑问词":["How","What","When","Where","Who","Why"],"动词":["can","come","do/does","elects","have/has","is/are/was/be","lives/lived","meet","name","pay","vote","want"],"其他":["a","for","here","in","of","on","the","to","we","colors","dollar bill","first","largest","many","most","north","one","people","second","south"]},
 "写作词汇":{"人物":["Adams","Lincoln","Washington"],"公民":["American Indians","capital","citizens","Civil War","Congress","Father of Our Country","flag","free","freedom of speech","President","right","Senators","state/states","White House"],"地点":["Alaska","California","Canada","Delaware","Mexico","New York City","United States","Washington","Washington, D.C."],"月份":["February","May","June","July","September","October","November"],"节日":["Presidents' Day","Memorial Day","Flag Day","Independence Day","Labor Day","Columbus Day","Thanksgiving"],"动词":["can","come","elect","have/has","is/was/be","lives/lived","meets","pay","vote","want"],"其他":["and","during","for","here","in","of","on","the","to","we","blue","dollar bill","fifty/50","first","largest","most","north","one","one hundred/100","people","red","second","south","taxes","white"]}
};
const NUMS={"50":["fifty"],"100":["one","hundred"]};
const words=s=>s.split(/\s+/).filter(Boolean);
const norm=s=>words(s.toLowerCase().replace(/d\.c\./g,"dc").replace(/[^a-z0-9'\s]/g," ")).flatMap(w=>NUMS[w]||[w]);
function diffWords(target,input){
  // 用最长公共子序列对齐：漏写/写错的目标词标红，多写的词划掉
  const T=words(target),tn=T.map(w=>norm(w).join(" ")),I2=norm(input);
  const tt=[];T.forEach((w,i)=>tn[i].split(" ").filter(Boolean).forEach(x=>tt.push({x,i})));
  const n=tt.length,m=I2.length,L=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=tt[i].x===I2[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const hit=new Set(),extra=[];let i=0,j=0;
  while(i<n&&j<m){if(tt[i].x===I2[j]){hit.add(i);i++;j++;}else if(L[i+1][j]>=L[i][j+1])i++;else{extra.push(I2[j]);j++;}}
  while(j<m)extra.push(I2[j++]);
  const okWord=T.map((w,k)=>tt.every((t,ti)=>t.i!==k||hit.has(ti)));
  return {T,okWord,extra,perfect:okWord.every(Boolean)&&!extra.length};
}
function RWView(){
  if(!state.mode){state.mode="read";state.order=shuffle(RW.map((_,i)=>i));state.i=0;state.checked=null;}
  const segs=[["read","阅读跟读"],["write","听写"],["vocab","词汇表"]];
  const head=`<div class="top"><div class="brand"><div class="seal">ABC</div><div><h1>英文读写</h1><p>面试时读对 1 句、写对 1 句即可</p></div></div></div>
   <div class="segs" role="tablist">${segs.map(([k,l])=>`<button data-mode="${k}" class="${state.mode===k?"on":""}" role="tab" aria-selected="${state.mode===k}">${l}</button>`).join("")}</div>`;
  const idx=state.order[state.i%state.order.length],item=RW[idx],zh=S.settings.zh;
  const nav=`<div class="row"><button class="btn" id="prev">上一句</button><button class="btn primary" id="next">下一句</button></div>`;
  let body="";
  if(state.mode==="read"){
    body=`<div class="card stack">
      <div class="qhead" style="margin:0"><span class="qnum">阅读 ${state.i%RW.length+1} / ${RW.length}</span><span class="chip">点单词可听发音</span></div>
      <div class="sentence">${words(item[0]).map(w=>`<button data-say="${esc(w.replace(/[?.,]/g,""))}" data-slow="1">${esc(w)}</button>`).join("")}</div>
      ${zh?`<div class="zh">${esc(item[1])}</div>`:""}
      <div class="row"><button class="btn" data-say="${esc(item[0])}">${I.speak} 正常速度</button><button class="btn" data-say="${esc(item[0])}" data-slow="1">${I.slow} 慢速跟读</button></div>
      <div class="note"><b>怎么练：</b>先听慢速，跟着大声读，再听正常速度读一遍。面试时官员会让你读出屏幕上的一句话，读对就通过。</div>
     </div>
     <details class="card"><summary style="cursor:pointer;font-weight:600">这句话的答案（写作也常考这句）</summary><div style="margin-top:12px" class="stack"><div style="font-family:var(--display);font-size:20px">${esc(item[2])}</div>${zh?`<div class="zh">${esc(item[3])}</div>`:""}<div class="row"><button class="btn" data-say="${esc(item[2])}" style="flex:none">${I.speak} 朗读</button><button class="btn" data-say="${esc(item[2])}" data-slow="1" style="flex:none">${I.slow} 慢速</button></div></div></details>${nav}`;
  }else if(state.mode==="write"){
    const c=state.checked;
    body=`<div class="card stack">
      <div class="qhead" style="margin:0"><span class="qnum">听写 ${state.i%RW.length+1} / ${RW.length}</span>${zh?`<span class="zh" style="font-size:13px">提示：${esc(item[3])}</span>`:""}</div>
      <div class="row"><button class="btn" data-say="${esc(item[2])}">${I.speak} 播放句子</button><button class="btn" data-say="${esc(item[2])}" data-slow="1">${I.slow} 慢速播放</button></div>
      <label for="dict" class="eyebrow">把听到的句子写下来</label>
      <input id="dict" class="dict-in" autocomplete="off" autocapitalize="sentences" spellcheck="false" placeholder="Type what you hear…" value="${esc(state.typed||"")}">
      ${c?`<div class="stack" style="gap:8px"><div class="eyebrow">${c.perfect?'<span style="color:var(--good)">完全正确</span>':"对照结果：红色是漏写或写错的词"}</div>
        <div class="diff">${c.T.map((w,k)=>`<span class="${c.okWord[k]?"ok":"miss"}">${esc(w)}</span>`).join("")}</div>
        ${c.extra.length?`<div class="diff"><span class="zh" style="font-size:14px;font-family:var(--zh)">多写了：</span>${c.extra.map(w=>`<span class="extra">${esc(w)}</span>`).join("")}</div>`:""}
        ${c.caseWarn?`<div class="note"><b>注意大小写。</b> 人名、地名、节日和句首字母要大写。</div>`:""}</div>`
       :`<button class="btn primary" id="check">检查</button>`}
      <div class="note"><b>评分说明：</b>真实考试里，小的拼写错误只要不影响意思，一般不会判错；数字写 50 或 fifty 都可以。这里检查得比较严，帮你把每个词都写对。</div>
     </div>${nav}`;
  }else{
    body=`<p class="zh" style="margin:0;font-size:14px">这是 USCIS 官方词汇表，考试的阅读句和写作句只会用到这些词。点任意一个词可以听慢速发音。</p>
     ${Object.entries(VOCAB).map(([t,g])=>`<div class="card stack"><h3 style="font-family:var(--display)">${t}</h3>${Object.entries(g).map(([k,ws])=>`<div class="stack" style="gap:8px"><div class="eyebrow">${k}</div><div class="vocab">${ws.map(w=>`<button data-say="${esc(w.replace("/"," or "))}" data-slow="1">${esc(w)}</button>`).join("")}</div></div>`).join("")}</div>`).join("")}`;
  }
  $("#app").innerHTML=`${head}<div class="stack" style="margin-top:14px">${body}</div>`;
  document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;state.checked=null;state.typed="";RWView();
    if(state.mode==="write")speak(RW[state.order[state.i%RW.length]][2],SLOW);});
  const move=d=>{state.i=(state.i+d+RW.length)%RW.length;state.checked=null;state.typed="";RWView();
    if(state.mode==="write")setTimeout(()=>speak(RW[state.order[state.i]][2],SLOW),200);};
  if($("#next")){$("#next").onclick=()=>move(1);$("#prev").onclick=()=>move(-1);}
  const inp=$("#dict");
  if(inp){
    inp.oninput=e=>{state.typed=e.target.value;};
    const check=()=>{const r=diffWords(item[2],inp.value);
      const bare=s=>words(s.replace(/[^A-Za-z0-9'\s]/g," ")).join(" ");
      r.caseWarn=r.perfect&&!/\d/.test(inp.value)&&bare(inp.value)!==bare(item[2]);
      state.checked=r;state.typed=inp.value;RWView();};
    inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();if(!state.checked)check();else move(1);}};
    if($("#check"))$("#check").onclick=check;
  }
}

/* ---------- 题库 ---------- */
function itemHTML(q){
  const p=S.p[q.id];
  const st=mastered(q.id)?'<span class="chip good">已掌握</span>':(S.wrong.includes(q.id)?'<span class="chip warn">错题</span>':(q.star?'<span class="chip star">★</span>':""));
  return `<details class="qitem"><summary><span class="n">${q.id}</span><span class="t">${esc(q.q)}${S.settings.zh?`<span class="zh">${esc(q.qz)}</span>`:""}</span>${st}</summary>
  <div class="body">${answersHTML(q)}<div class="row"><button class="btn" data-speak="${q.id}" style="flex:none">${I.speak} 朗读问题</button><button class="btn" data-speak="${q.id}" data-slow="1" style="flex:none">${I.slow} 慢速</button></div></div></details>`;
}
function List(){
  if(state.f===undefined){state.f="all";state.s="";}
  const P=pool();
  const filters=[["all","全部"],["star","★ 65/20"],...SECTIONS.map(s=>[s.key,s.name])];
  $("#app").innerHTML=`<div class="top"><div class="brand"><div class="seal">128</div><div><h1>全部题目</h1><p>点开题目看答案</p></div></div></div>
  <div class="stack"><div class="search"><input id="s" type="search" placeholder="搜索英文或中文，如 senator、总统" value="${esc(state.s)}" aria-label="搜索题目"></div>
  <div class="filters">${filters.map(([k,l])=>`<button data-f="${k}" class="${state.f===k?"on":""}">${l}</button>`).join("")}</div>
  <div id="items"></div></div>`;
  const draw=()=>{
    const s=state.s.toLowerCase();
    let qs=P.filter(q=>state.f==="all"||(state.f==="star"?q.star:secOf(q.id).key===state.f));
    if(s)qs=qs.filter(q=>(q.q+q.qz+q.a.map(a=>a.join(" ")).join(" ")+" "+q.id).toLowerCase().includes(s));
    let html="",last="";
    for(const q of qs){const {s:sec,p}=partOf(q.id);const k=sec.key+p[0];if(k!==last&&!s){html+=`<div class="secttl">${sec.en} · ${p[0]}: ${p[1]}</div>`;last=k;}html+=itemHTML(q);}
    $("#items").innerHTML=html||`<div class="empty">没有找到相关题目</div>`;
  };
  draw();
  $("#s").oninput=e=>{state.s=e.target.value;draw();};
  document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{state.f=b.dataset.f;List();});
}

try{speechSynthesis.getVoices();}catch(e){}
render();
